name: Build macOS App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Universal macOS Release
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Whisper models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Verbatim/Verbatim/models/*.bin
          key: whisper-models-${{ hashFiles('scripts/models.sha256') }}

      - name: Set build version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 2))" >> "$GITHUB_ENV"
          if [[ "$REF_TYPE" == tag ]]; then
            version="${REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo 'Release tags must look like v1.0.3' >&2
              exit 1
            fi
            echo "VERSION=$version" >> "$GITHUB_ENV"
          fi

      - name: Build, verify, and package app
        id: package
        run: bash scripts/build-macos.sh

      - name: Upload single-ZIP app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Verbatim-macOS-${{ github.sha }}
          path: |
            dist/${{ steps.package.outputs.zip_name }}
            dist/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        env:
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
        run: |
          {
            echo '## Verbatim for macOS'
            echo "- Commit: $GITHUB_SHA"
            echo "- Archive: $ZIP_NAME"
            echo '- Architectures: Apple silicon (arm64) and Intel (x86_64)'
            echo '- Bundled models: Base, Small, Large v3 (SHA-256 verified)'
            echo '- Signing: ad-hoc, not notarized'
            echo '- Download the artifact below, then extract the inner ZIP to get Verbatim.app.'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download verified app archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Verbatim-macOS-${{ github.sha }}
          path: dist

      - name: Prepare release assets
        working-directory: dist
        run: |
          sha256sum --check SHA256SUMS.txt
          mkdir -p ../release
          # Release assets must each be smaller than 2 GiB.
          split -b 1900M Verbatim-*.zip ../release/Verbatim-macOS-universal.zip.part-
          cp SHA256SUMS.txt ../release/ZIP-SHA256SUMS.txt
          cd ../release
          sha256sum Verbatim-*.part-* > SHA256SUMS.txt

      - name: Publish release after uploading all assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## macOS Universal App

          Native macOS Release for Apple silicon and Intel, with Base, Small, and Large v3 bundled for offline transcription. Requires macOS 15.7 or newer.

          Includes automatic macOS builds on every push to main and the latest media playback fixes.

          ### Download and open

          GitHub's per-file limit requires the full ZIP to be split. Download both `.part-*` files and both checksum files into the same folder, then run:

          ```sh
          shasum -a 256 -c SHA256SUMS.txt
          cat Verbatim-macOS-universal.zip.part-* > Verbatim-macOS-universal-RELEASE_VERSION.zip
          shasum -a 256 -c ZIP-SHA256SUMS.txt
          ```

          Extract the reconstructed ZIP and move `Verbatim.app` into Applications. Actions artifacts and local builds retain the single-ZIP format.

          This app is ad-hoc signed, not Developer ID signed or notarized. macOS may require approval in System Settings > Privacy & Security on first launch.
          NOTES
          sed -i "s/RELEASE_VERSION/${RELEASE_TAG}/g" release-notes.md
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Verbatim $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
